site:
  url: https://modellen.netbeheernederland.nl/fair-dx
  start_page: ROOT::index.adoc
content:
  sources:
    - url: ''
      tags: '@({1..9})*({0..9}).+({0..9})'
      branches:
        - main
        - draft*
      start_path: src
asciidoc:
  attributes:
    kroki-fetch-diagram: true
    kroki-default-format: svg@
    kroki-server-url: http://fruit.ritger.nl:9000
  extensions:
    - asciidoctor-kroki
output:
  clean: true
  dir: docs
ui:
  bundle:
    url: https://github.com/Netbeheer-Nederland/antora-ui-nbnl/releases/download/1.2/ui-bundle.zip
  default_layout: single-page  # TODO: `standard`
antora:
  extensions:
    - require: 'scripts/add-collector-config.js'
    - require: '@antora/collector-extension'
    - require: 'scripts/version-postprocessor.js'
    - require: '@antora/lunr-extension'
